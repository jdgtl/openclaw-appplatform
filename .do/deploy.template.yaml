spec:
  name: openclaw
  region: tor
  workers:
    - name: openclaw
      dockerfile_path: /Dockerfile
      source_dir: /
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-2gb # Minimum 2GB required - 1GB causes heap overflow
      git:
        branch: main
        repo_clone_url: https://github.com/digitalocean-labs/openclaw-appplatform.git
      envs:
        # Provide your Gradient inference key
        - key: GRADIENT_API_KEY
          scope: RUN_TIME
          type: SECRET

        # Required
        - key: OPENCLAW_GATEWAY_TOKEN
          scope: RUN_TIME
          type: SECRET
        - key: STABLE_HOSTNAME
          scope: RUN_TIME
          value: openclaw

        # Feature flags
        - key: ENABLE_NGROK
          scope: RUN_TIME
          value: "false"
        - key: TAILSCALE_ENABLE
          scope: RUN_TIME
          value: "false"
        - key: ENABLE_SPACES
          scope: RUN_TIME
          value: "false"
        - key: ENABLE_UI
          scope: RUN_TIME
          value: "false"

        # ngrok config
        - key: NGROK_AUTHTOKEN
          scope: RUN_TIME
          type: SECRET

        # Tailscale config
        - key: TS_AUTHKEY
          scope: RUN_TIME
          type: SECRET

        # Spaces config
        - key: RESTIC_SPACES_ACCESS_KEY_ID
          scope: RUN_TIME
          type: SECRET
        - key: RESTIC_SPACES_SECRET_ACCESS_KEY
          scope: RUN_TIME
          type: SECRET
        - key: RESTIC_SPACES_ENDPOINT
          scope: RUN_TIME
          value: tor1.digitaloceanspaces.com
        - key: RESTIC_SPACES_BUCKET
          scope: RUN_TIME
          value: openclaw-backup
        - key: RESTIC_PASSWORD
          scope: RUN_TIME
          type: SECRET

        # Slack channel config
        - key: SLACK_ENABLE
          scope: RUN_TIME
          value: "false"
        - key: SLACK_BOT_TOKEN
          scope: RUN_TIME
          type: SECRET
        - key: SLACK_APP_TOKEN
          scope: RUN_TIME
          type: SECRET

        # Web search (Brave free tier: 2000 queries/month)
        - key: BRAVE_API_KEY
          scope: RUN_TIME
          type: SECRET

        # GOG (Google OAuth Gateway) keyring encryption
        - key: GOG_KEYRING_PASSWORD
          scope: RUN_TIME
          type: SECRET

        # GitHub CLI (gh) authentication
        - key: GH_TOKEN
          scope: RUN_TIME
          type: SECRET

        # Aperture AI proxy (Tailscale) — manages API keys centrally
        - key: ANTHROPIC_BASE_URL
          scope: RUN_TIME
          value: "http://ai.taila801b3.ts.net"
        - key: ANTHROPIC_API_KEY
          scope: RUN_TIME
          value: "-"
        - key: OPENAI_BASE_URL
          scope: RUN_TIME
          value: "http://ai.taila801b3.ts.net"
        - key: OPENAI_API_KEY
          scope: RUN_TIME
          value: "-"

        # Notion API
        - key: NOTION_API_KEY
          scope: RUN_TIME
          type: SECRET

        # ClickUp API (used by mcporter MCP server)
        - key: CLICKUP_API_TOKEN
          scope: RUN_TIME
          type: SECRET

        # Mission Control dashboard
        - key: MC_ENABLE
          scope: RUN_TIME
          value: "false"
        - key: MC_PORT
          scope: RUN_TIME
          value: "3333"

        # Optional
        - key: OPENCLAW_GATEWAY_TOKEN
          scope: RUN_TIME
          type: SECRET
        - key: SSH_ENABLE
          scope: RUN_TIME
          value: "false"
        - key: GITHUB_USERNAME
          scope: RUN_TIME
          value: ""
